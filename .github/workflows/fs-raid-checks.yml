name: Filesystem and RAID checks

on:
  push:
    paths:
      - reinstall.sh
      - reinstall.bat
      - trans.sh
      - tests/**
      - .github/workflows/fs-raid-checks.yml
  pull_request:
    paths:
      - reinstall.sh
      - reinstall.bat
      - trans.sh
      - tests/**
      - .github/workflows/fs-raid-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox shellcheck e2fsprogs xfsprogs
      - name: Check shell syntax
        run: |
          bash -n reinstall.sh
          busybox ash -n trans.sh
          shellcheck --severity=error reinstall.sh trans.sh
      - name: Check filesystem and RAID functions
        run: python3 -m unittest discover -s tests -v
